name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check tag matches versionName
        run: |
          VERSION="$(./gradlew -q :app:printVersionName | tail -n 1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; print; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "Release $GITHUB_REF_NAME" > release_notes.md; fi

      - name: Collect APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          LITE="$(ls app/build/outputs/apk/lite/release/*.apk | head -n 1)"
          FULL="$(ls app/build/outputs/apk/full/release/*.apk | head -n 1)"
          test -n "$LITE" && test -n "$FULL"
          cp "$LITE" "dist/SoundCloud-Lite-v$VERSION.apk"
          cp "$FULL" "dist/SoundCloud-Full-v$VERSION.apk"
          ls -la dist

      - name: Check both APKs share the signing key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          A="$("$APKSIGNER" verify --print-certs dist/SoundCloud-Lite-*.apk | grep -m1 'SHA-256')"
          B="$("$APKSIGNER" verify --print-certs dist/SoundCloud-Full-*.apk | grep -m1 'SHA-256')"
          echo "lite: $A"
          echo "full: $B"
          if [ -z "$A" ] || [ "$A" != "$B" ]; then
            echo "::error::Lite and Full must be signed with the same key"
            exit 1
          fi

      - name: Checksums and signing certificate
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cd - > /dev/null
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo ""
            echo "---"
            echo ""
            echo "**Какой APK качать:**"
            echo ""
            echo "- \`SoundCloud-Full-v${GITHUB_REF_NAME#v}.apk\` — SoundCloud, новый Glass-дизайн (\`com.scd.android.full\`)"
            echo "- \`SoundCloud-Lite-v${GITHUB_REF_NAME#v}.apk\` — SoundCloud Lite, привычный интерфейс (\`com.scd.android\`)"
            echo ""
            echo "Можно поставить оба сразу — загрузки и плейлисты у них общие."
            echo ""
            echo "**SHA-256 APK:**"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "**Signing certificate:**"
            echo '```'
            "$APKSIGNER" verify --print-certs "$(ls dist/*.apk | head -n 1)" | grep -E "SHA-256" || true
            echo '```'
          } >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
